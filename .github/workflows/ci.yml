name: ci
on:
  push:
  pull_request:
    
jobs:
  lint_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version: '1.26.2'
        cache: true 

    - name: lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.11.2

    - name: test 
      run: go test --race ./...
