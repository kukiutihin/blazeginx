name: ci
on:
  push
  pull_request
    
jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: false
    - name: lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.11
    - name: test 
      run: go test ./...
