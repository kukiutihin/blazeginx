#
# Dont forget to set path to your config in 
# CONFIG_PATH enviroment variable
#

env: "local" # local(default), dev, prod

addr: "127.0.0.1:8888" # default

# required
services:
  - name: "api"
    url: "localhost:8080"    

# required
routes:
  - path: "/api/"
    service: "api"
    strip_prefix: false # default

rate-limit:
  enabled: true # default
  refill_rate: 30s # default
  max_tokens: 100 # default
  default_expiration_time: 30s # default
  cleanup_interval: 30s #default

timeout:
  upstream: 2s # default
  server: 5s # default
  idle: 80s # default

static:
  enabled: false # default
  root: "./web/dist" # default
